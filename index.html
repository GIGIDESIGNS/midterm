<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio to Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one isometric world seen from high above — studio room top-left, park path, station bottom-right.
   Words sit in a paper card top-left; the backpack sits along the bottom. */
:root{
  --paper:#f1ead2;   /* ground, cards */
  --ink:#2b2420;     /* lines, text */
  --orange:#e0632b;  /* backpack items: what I take with me */
  --mustard:#d9a447;
  --olive:#a3a36a;
  --blue:#5d84b3;
  --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  color-scheme:light;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body)}
canvas#world{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#world.dragging{cursor:grabbing}
video{display:none}
[hidden]{display:none!important}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 rgba(60,45,35,.22)}

#panel{z-index:2;position:fixed;top:4vh;left:3vw;width:min(36vw,640px);overflow:hidden;box-sizing:border-box;
  font-size:clamp(13px,1.05vw,20px);
  padding:1.4em 1.5em;display:flex;flex-direction:column;gap:.6em;
  transition:opacity .45s ease,transform .5s ease}
#panel.off{opacity:0;transform:translateY(-12px);pointer-events:none}
#panel .kicker{font:700 .85em/1.25 var(--body);letter-spacing:.14em;text-transform:uppercase}
#panel h2{font:800 2.9em/.98 var(--display);margin:0;text-wrap:balance}
#panel .tagline{font:italic 500 1.4em/1.3 var(--body);margin:0}
#panel .takeaway{display:flex;flex-direction:column;gap:.25em;padding:.6em 0 .1em;border-top:1.5px dashed var(--ink)}
#panel .takeaway b{font:700 1.55em/1 var(--hand)}
#panel .takeaway span{font:700 1.3em/1.3 var(--body)}
#panel .process{display:flex;flex-direction:column;gap:.3em;padding-top:.5em;border-top:1.5px dashed var(--ink)}
#panel .process b{font:700 1.55em/1 var(--hand)}
#panel .process ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3em}
#panel .process li{font:400 1.05em/1.35 var(--body);padding-left:1.1em;position:relative}
#panel .process li::before{content:"";position:absolute;left:0;top:.5em;width:.5em;height:.5em;background:var(--orange)}
#panel .body{margin:0;display:flex;flex-direction:column;gap:.4em}
#panel .body .line1{font:700 1.4em/1.3 var(--body)}
#panel .body .line2{font:400 1.15em/1.4 var(--body)}
#panel .carry{display:flex;flex-direction:column;gap:.4em;padding-top:.4em;border-top:1.5px dashed var(--ink)}
#panel .carry b{font:700 1.55em/1 var(--hand)}
#panel .chips{display:flex;flex-wrap:wrap;gap:.4em}
#panel .chip{font:700 .95em/1.2 var(--body);padding:.35em .8em;border-radius:999px;border:2px solid var(--ink);background:var(--orange);color:var(--ink)}
#panel .chip.empty{background:transparent;border-style:dashed}

#dim{position:fixed;inset:0;z-index:1;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .5s ease}
#dim.on{opacity:.86}
#gallery{z-index:2;position:fixed;top:4vh;bottom:150px;left:calc(3vw + min(36vw,640px) + 2vw);right:3vw;display:flex;flex-direction:column;gap:10px;
  transition:opacity .45s ease,transform .5s ease}
#gallery.off{opacity:0;transform:translateX(20px);pointer-events:none}
#gallery .grid{position:absolute;inset:0}
#gallery .tile{position:absolute;display:flex;flex-direction:column;gap:4px;cursor:zoom-in}
#gallery .tile .box{position:relative;flex:1 1 auto;min-height:0;background:#fbf6e6;border:2px solid var(--ink);border-radius:3px;box-shadow:4px 4px 0 rgba(60,45,35,.2);overflow:hidden}
#gallery .tile.on .box{outline:3px solid var(--orange);outline-offset:2px}
#gallery .box img,#gallery .box video,#gallery .bigframe img,#gallery .bigframe video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
#gallery .tcap{margin:0;font:700 13px/1.25 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:18px}
#gallery .gtext{position:absolute;inset:0;padding:1.1em 1.3em;display:flex;flex-direction:column;justify-content:center;gap:.45em;font-weight:600;line-height:1.35;overflow:hidden}
#gallery .gtext .gh{font:800 1.35em/1.1 var(--display)}
#gallery .gtext .gb{font-weight:400;line-height:1.4}
#gallery .gtools{position:absolute;inset:0;padding:1.1em 1.3em;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:.35em}
#gallery .gtools b{font:700 1.45em/1 var(--hand)}
#gallery .gtools ul{margin:0;padding:0;display:flex;flex-direction:column;gap:.25em}
#gallery .gtools li{font-weight:700;line-height:1.3;list-style:none;padding-left:1em;position:relative}
#gallery .gtools li::before{content:"";position:absolute;left:0;top:.5em;width:.45em;height:.45em;background:var(--orange)}
#gallery .err{color:#b33a2a}
#gallery .big{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;background:var(--paper);z-index:2}
#gallery .bigframe{position:relative;flex:1 1 auto;min-height:0;background:#fbf6e6;border:2px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 rgba(60,45,35,.22);overflow:hidden;transition:transform .25s ease}
#gallery .big .gcap{margin:0;font:700 clamp(14px,1.15vw,21px)/1.3 var(--body)}
#pack{z-index:3;position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;
  padding:6px 16px 8px;background:rgba(241,234,210,.92);border:2px solid var(--ink);border-radius:4px}
#pack .packLabel{font:700 22px/1 var(--hand)}
#pack .slots{display:flex;gap:8px}
.slot{width:100px;display:flex;flex-direction:column;align-items:center;gap:3px}
.slot canvas{width:52px;height:52px}
.slot span{font:700 12px/1.2 var(--body);text-align:center;min-height:2.4em;opacity:0;transition:opacity .4s}
.slot.full span{opacity:1}
.slot.glow canvas{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}

#start{z-index:7;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 26px;width:min(560px,calc(100vw - 32px));box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
#start h1{font:800 clamp(24px,2.2vw,36px)/1.05 var(--display);margin:0}
#start p{margin:0;font-size:16px;line-height:1.45}
#start .row{display:flex;gap:10px;flex-wrap:wrap}
button{font:700 16px var(--body);padding:11px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
#topright{z-index:6;position:fixed;right:16px;top:14px;display:flex;gap:8px;align-items:center}
#btnCamToggle{transition:opacity .4s}
body:not(.mouse) #btnCamToggle{opacity:0;pointer-events:none}
#topright button{font-size:13px;padding:6px 13px;background:var(--paper)}
#status{padding:7px 13px;font:700 13px var(--body);border-radius:999px;display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--ink)}
#status i{width:10px;height:10px;border-radius:50%;background:#999;display:inline-block}
#status.ok i{background:#5f8a3b}#status.warn i{background:#d9a447}#status.bad i{background:#b33a2a}
#help{position:fixed;top:16px;right:16px;margin-top:48px;padding:16px 20px;font-size:15px;line-height:1.5;max-width:420px}
#help h3{font:800 18px var(--display);margin:0 0 6px}
#help table{border-collapse:collapse}#help td{padding:2px 10px 2px 0;vertical-align:top}#help td:first-child{font-weight:700;white-space:nowrap}
#hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#cam{z-index:4;position:fixed;left:16px;bottom:12px;width:200px;height:150px;border:2px solid var(--ink);border-radius:4px;background:#222}
@media (prefers-reduced-motion: reduce){#panel{transition:none}.slot.glow canvas{animation:none}}
</style>
</head>
<body>
<canvas id="world" aria-label="A studio room with six workshop tables, a door, a park path and a train station with six stops up to the platform"></canvas>

<script type="module">
/* ============================================================

   photos:   up to 3 per stop. src = an image file next to this page, e.g. "vj-1.jpg"

   ============================================================ */
const PAST = [

           {src:"photos/vj-2 (h264).mp4",caption:"Working in TouchDesigner"},
           {src:"photos/vj-3.mp4",caption:"Live visuals"},
           {tools:["Guitar","Scarlett audio interface","MIDI Guitar 2","loopMIDI","TouchDesigner"],title:"Signal chain",caption:"Guitar to visuals: the notes arrived"}]},
  {title:"AI workshop", meta:"Week 5 · with Xinyi Zhang", visual:2,
   tagline:"Nephil, a being of the fourth dimension",
   lesson:"What you feed an AI is what it gives back",
   process:["A lot of working with LLMs: prompting and conversing", "Talking through the ethics of AI, which was the best part"],
   takeaway:"Operating agents", packLong:"Operating agents, with a deep understanding of how they work", icon:"agents",
   photos:[{src:"photos/ai-1.jpg",caption:"Nephil's self-image"},
           {src:"photos/ai-2.jpg",caption:"Nephil, pictured as a person"},
           {src:"photos/ai-3.png",caption:"Nephil's SOUL.md"},
           {src:"photos/ai-4.mp4",caption:"An AI film of my Tuning Bench"},
           {src:"photos/ai-5.png",caption:"Agents talking to each other in our group project"},
           {tools:["LLMs","SOUL.md","Neuronpedia","Replicate"],caption:"Tools I used"}]},
  {title:"Research question", meta:"Week 6 · with Zack", visual:5,
   tagline:"Context, users, aim",
   lesson:"How to formulate a research question step by step, and validate it with myself",
   process:["Looking at it from every angle: context, audience, goal and aim","Building it step by step, then checking it holds up"],
   takeaway:"Better research question", packLong:"Formulating a better research question", icon:"question",
   photos:[{head:"The recipe",text:"Context + users + aim. Stuck on the wording? Say where you want to be at the end, then add a question mark.",caption:""},

const FUTURE = [
  {title:"Research question", sub:"",
   body:["How can tactile interactions built into train stations let frequent train travellers form small rituals of their own choosing, before and after a journey?","Next: three sub-questions"], uses:[5],
   photos:[{head:"Users",text:"What do commuters feel and need around a journey, and what do they already do with their bodies?",caption:"Sub-question 1"},
           {head:"Context",text:"Which spots in a station invite touch or leaning, and which make people avoid it?",caption:"Sub-question 2"},
           {head:"Aim",text:"Which tactile qualities (texture, temperature, give, rhythm) help people slow their breathing or simply feel good?",caption:"Sub-question 3"}]},
  {title:"Context & environment", sub:"",
   body:["Train stations. The moments before and after a journey."], uses:[], photos:[{head:"In the station",text:"Built into the space. Optional, never forced. Something you choose, not something asked of you.",caption:""}]},
  {title:"Audience", sub:"",
   body:["People who take the train often"], uses:[], photos:[{head:"Daily commuters",text:"Mostly going to and from work. The start and the end of their day.",caption:""}]},
  {title:"Goal", sub:"",
   body:["A snack for your nervous system"], uses:[6],
   photos:[{head:"A snack, not a meal",text:"Quick, fun, free, no commitment. Grabbed on the way.",caption:""},
           {head:"Care",text:"Someone thought of me.",caption:""},
           {head:"Reclaiming public space",text:"Calm doesn't have to wait until you get home.",caption:""}]},
  {title:"Technologies", sub:"",
   body:["Arduino + sensors","Second: likely Sonic Landscapes"], uses:[2,3],
   photos:[{head:"Arduino",text:"Locked in. The technology I'm taking forward from the studio.",caption:""},
           {head:"Sensors",text:"Pressure (hidden behind organic material), presence, distance.",caption:""},
           {head:"Sonic Landscapes, likely",text:"Sound as atmosphere next to the touch, like the rustle in Rustle Portal. Decided after the November workshop.",caption:""}]},
  {title:"Plan", sub:"",
   body:["Observe → Ask → Prototype → Test → Build","Nov: observe stations, ask commuters, quick prototypes","Dec: two rounds of people testing","Jan: build the final piece","Final evaluation: 18 Jan 2027"], uses:[],
   photos:[{head:"Observe",text:"Rush-hour station visits: where do people wait, lean, touch, fidget?",caption:"Context + users · early Nov"},
           {head:"Ask",text:"A short questionnaire for 20–30 commuters, plus longer talks with a few.",caption:"Users · early Nov"},
           {head:"Prototype",text:"A touch board of textures to rank, and a rough leaning prototype with a pressure sensor.",caption:"Aim · mid–late Nov"},
           {head:"Test",text:"Two rounds with 5–8 people: how did it feel, what did you do, would you use it on your way?",caption:"Aim + users · Dec"},
           {head:"Build",text:"Robust and circular: local, easy to fix, easy to source. Used with the back, half leaning, no hands needed.",caption:"Jan"}]},

/* Gesture tuning — adjust on test day if needed */
const CONFIG = {
  holdMs: 1000,        // how long to hold a finger count
  pinchOn: 0.32, pinchOff: 0.48,   // pinch sensitivity (lower = must pinch tighter)
  panGain: 1.8,        // how far the view moves per hand movement
  twistGain: 1.7,      // zoom per radian of twist (left hand)
  fistTight: 0.6,      // how closed a fist must be to count as 'resting' (higher = easier)
  enterHoldMs: 900,    // pinch and hold still this long to open a stop
  leaveHoldMs: 1000,   // two open palms held this long to leave a stop
  enterZoom: 3,        // how close (x overview) before you can open a stop
  flyRate: 3.0,        // camera glide speed (medium pace)
  walkSpeed: 1800,     // walker speed, world units per second
  turnSec: 2.2,        // how long the camera takes to turn when you leave the studio
  exitDelayMs: 900,    // pause after the 6th takeaway lands before walking out
  exitWalkSec: 2.8,    // how long the walk from the last table to the station takes
};

/* ============================================================ */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const C={paper:"#f1ead2",ink:"#2b2420",floor:"#e7dcbd",tile:"#e3d8b8",wallL:"#ead9b4",wallR:"#cdb98f",
  shadeL:"#ddd0ac",shadeR:"#bba982",orange:"#e0632b",mustard:"#d9a447",olive:"#a3a36a",oliveD:"#767a4d",oliveL:"#c4bf86",
  blue:"#5d84b3",blueD:"#3f5f88",roof:"#5a4339",brown:"#7a5a45",grey:"#a9a69a",shadow:"rgba(70,52,40,.30)",path:"#ddd2b1"};
const FONT_D='"Bricolage Grotesque","Arial Narrow",Arial,sans-serif';
const FONT_B='"Atkinson Hyperlegible",Verdana,Arial,sans-serif';
const FONT_H='"Caveat","Segoe Print","Comic Sans MS",cursive';
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000;};}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

/* ---------- isometric helpers ---------- */
/* The camera: an orthographic view that can turn. viewB = 0 is the studio view (classic isometric),
   viewB = 1 is the station view: turned to face forward along the route and a little lower. */
const S0=1.2247, PHI0=Math.PI/4, PHI1=Math.PI*2/3, E0=Math.asin(1/Math.sqrt(3)), E1=26*Math.PI/180;
let SP=Math.sin(PHI0),CP=Math.cos(PHI0),SE=Math.sin(E0),CE=Math.cos(E0);
function setView(b){const ph=PHI0+(PHI1-PHI0)*b,e=E0+(E1-E0)*b;SP=Math.sin(ph);CP=Math.cos(ph);SE=Math.sin(e);CE=Math.cos(e);}
let OU=0,OV=0; // temporary world offset, used to move whole station objects
const P=(u,v,z=0)=>{u+=OU;v+=OV;return [S0*(u*SP-v*CP),S0*SE*(u*CP+v*SP)-S0*CE*z];};
const withOff=(du,dv,fn)=>()=>{const a=OU,b=OV;OU+=du;OV+=dv;try{fn();}finally{OU=a;OV=b;}};
const depth=(u,v)=>u*CP+v*SP;
function invP(x,y,o){const a=x/S0,b=y/(S0*o.SE);return [a*o.SP+b*o.CP,-a*o.CP+b*o.SP];}
const cv=document.getElementById("world"), ctxWorld=cv.getContext("2d"), hud=document.getElementById("hud"), ctxHud=hud.getContext("2d");
let ctx=ctxWorld;
function rr(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function poly3(pts){ctx.beginPath();pts.forEach((p,i)=>{const [x,y]=P(p[0],p[1],p[2]||0);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();}
function face(pts,fill,stroke=true){poly3(pts);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke)ctx.stroke();}
function ink(w=2){ctx.lineWidth=w;ctx.strokeStyle=C.ink;ctx.lineJoin="round";ctx.lineCap="round";}
function box(u,v,z,w,d,h,o={}){
  ink(o.lw||2.2);
  const fv=SP>=0?v+d:v, fu=CP>=0?u+w:u;
  face([[u,fv,z],[u+w,fv,z],[u+w,fv,z+h],[u,fv,z+h]],o.left||C.shadeL);
  if(Math.abs(CP)>0.02)face([[fu,v,z],[fu,v+d,z],[fu,v+d,z+h],[fu,v,z+h]],o.right||C.shadeR);
  face([[u,v,z+h],[u+w,v,z+h],[u+w,v+d,z+h],[u,v+d,z+h]],o.top||C.paper);
}
// cast shadow on the ground (light from the upper right, shadows fall to the lower left, like the reference)
const SHV=[-0.25,0.85];
function hull(pts){pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(const p of pts.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  return lo.slice(0,-1).concat(up.slice(0,-1));}
function shadow(u,v,w,d,h,z0=0){
  const f=[[u,v],[u+w,v],[u+w,v+d],[u,v+d]],o=f.map(([a,b])=>[a+SHV[0]*h,b+SHV[1]*h]);
  ctx.beginPath();hull(f.concat(o)).forEach(([a,b],i)=>{const [x,y]=P(a,b,z0);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();
  ctx.fillStyle=C.shadow;ctx.fill();
}
function line3(a,b,w=2){ink(w);const [x1,y1]=P(...a),[x2,y2]=P(...b);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
// draw in a face's own flat coordinates. plane "v": a face at fixed v (faces lower-left); plane "u": fixed u (faces lower-right)
function onFace(plane,u,v,z,fn){const [x,y]=P(u,v,z),o=P(0,0,0),a=plane==="v"?P(1,0,0):plane==="u"?P(0,-1,0):P(0,1,0);
  ctx.save();ctx.transform(a[0]-o[0],a[1]-o[1],0,S0*CE,x,y);fn();ctx.restore();}

/* ---------- people (flat figures, like the reference) ---------- */
function person(u,v,z,o={}){
  const [x,y]=P(u,v,z);const s=o.s||1;
  if(!o.noShadow){ctx.fillStyle=C.shadow;ctx.beginPath();ctx.ellipse(x-30*s,y+6*s,34*s,9*s,-0.25,0,7);ctx.fill();}
  ctx.save();ctx.translate(x,y);ctx.scale((o.dir||1)*s,s);
  ink(2.4);
  if(o.sit){
    ctx.lineWidth=10;ctx.strokeStyle=C.ink;ctx.beginPath();ctx.moveTo(0,-62);ctx.lineTo(0,-46);ctx.lineTo(26,-46);ctx.lineTo(26,-2);ctx.stroke();
  }else{
    const sw=o.step?Math.sin(o.step)*13:0;
    ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(0,-64);ctx.lineTo(-6-sw,0);ctx.moveTo(0,-64);ctx.lineTo(6+sw,0);ctx.stroke();
  }
  const top=o.sit?-118:-132;
  ink(2.4);
  if(o.pack){ctx.fillStyle=C.orange;ctx.beginPath();rr(-34,top+6,24,50,7);ctx.fill();ctx.stroke();}
  ctx.fillStyle=o.coat||C.blue;ctx.beginPath();rr(-17,top,34,top<0?(o.sit?62:72):0,13);ctx.fill();ctx.stroke();
  if(o.reach){ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(8,top+18);ctx.lineTo(o.reach[0],o.reach[1]);ctx.stroke();}
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(0,top-17,15,0,7);ctx.fill();
  ctx.restore();
}

function bandPoly(pts,wd){const L=[],R=[];
  for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    L.push([pts[i][0]-dy*wd,pts[i][1]+dx*wd]);R.push([pts[i][0]+dy*wd,pts[i][1]-dx*wd]);}
  return L.concat(R.reverse());}

    if(pinchHold.side===side&&pinchHold.prog>0.1&&pinchHold.target){ // which stop is about to open
      const t=pinchHold.target,[tx,ty]=toScreen(t.mx,t.my);ctx.lineWidth=5;ctx.strokeStyle=C.orange;ctx.setLineDash([8,7]);
      ctx.beginPath();ctx.arc(tx,ty,Math.max(30,22*Math.min(2.5,cam.z/overviewZoom())),0,7);ctx.stroke();ctx.setLineDash([]);}
    if(pinchHold.side===side&&pinchHold.prog>0.1){ctx.lineWidth=7;ctx.strokeStyle=C.orange;ctx.lineCap="round";
      ctx.beginPath();ctx.arc(x,y,34,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,pinchHold.prog));ctx.stroke();}
    ctx.lineWidth=6;ctx.strokeStyle=C.paper;ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.stroke();
    ctx.lineWidth=3;ctx.strokeStyle=C.ink;ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.stroke();
    if(h.pinching){ctx.fillStyle=C.orange;ctx.beginPath();ctx.arc(x,y,13,0,7);ctx.fill();}
    ctx.font=`700 15px ${FONT_B}`;ctx.fillStyle=C.ink;ctx.textAlign="center";ctx.textBaseline="middle";ctx.strokeStyle=C.paper;ctx.lineWidth=4;
    ctx.globalAlpha=1;
  }
  if(hold.key&&hold.prog>0.08){
    const x=SW/2,y=SH-230,r=46;
    ctx.fillStyle="rgba(241,234,210,.96)";ctx.beginPath();ctx.arc(x,y,r+10,0,7);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.ink;ctx.stroke();
    ctx.lineWidth=9;ctx.strokeStyle=C.orange;ctx.lineCap="round";ctx.beginPath();ctx.arc(x,y,r-4,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,hold.prog));ctx.stroke();
    ctx.fillStyle=C.ink;ctx.textAlign="center";ctx.textBaseline="middle";let label;
    if(hold.key==="overview"){ctx.font=`800 22px ${FONT_D}`;ctx.fillText(focus?"out":"all",x,y);label=focus?"Leave this stop":"Overview";}
    else if(hold.key[0]==="p"){const n=+hold.key.slice(1);ctx.font=`800 ${n?44:22}px ${FONT_D}`;ctx.fillText(n||"back",x,y+2);label=n?"Photo "+n:"Back to the stop";}
    else{const n=+hold.key.slice(1);ctx.font=`800 44px ${FONT_D}`;ctx.fillText(n,x,y+2);const it=zoneItems(zone)[n-1];label=it?it.title:"";}
  }
  if(flashText&&now-flashT<1800){
    const a=1-Math.max(0,(now-flashT-1300)/500);ctx.globalAlpha=a;
    ctx.font=`800 40px ${FONT_D}`;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.lineWidth=10;ctx.strokeStyle=C.paper;ctx.strokeText(flashText,SW/2,SH*0.1);ctx.fillStyle=C.ink;ctx.fillText(flashText,SW/2,SH*0.1);ctx.globalAlpha=1;
  }
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
}

/* ---------- main loop ---------- */
let last=performance.now(), viewP=0;
goOverview(true);
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  detect(t);
  const k=1-Math.exp(-dt*rate);
  cam.x+=(camT.x-cam.x)*k;cam.y+=(camT.y-cam.y)*k;cam.z+=(camT.z-cam.z)*k;
  updateWalker(dt);
  const vt=walker.s>=DOOR_S?1:0;
  if(viewP!==vt){
    const old={SP,CP,SE};
    viewP=reduceMotion?vt:(vt>viewP?Math.min(vt,viewP+dt/CONFIG.turnSec):Math.max(vt,viewP-dt/CONFIG.turnSec));
    setView(ease(viewP));
    for(const c of [cam,camT]){const g=invP(c.x,c.y,old);[c.x,c.y]=P(g[0],g[1],0);}
    updateItemPositions();
    if(focus){if(photoIdx)photoTarget(focus.cards[photoIdx-1]);else frameStop(focus);}
    else if(Math.abs(camT.z/overviewZoom()-1)<0.2)goOverview();
  }
  if(focus&&browsing&&!photoIdx&&focus.frame){
    const L=browseLimits(),f=focus.frame,t=clamp((camT.z-f.z)/((L.zMax-f.z)||1),0,1),c=focus.cards[0];
    const cy=c?c.y+c.h/2+70/camT.z:f.y;camT.y=f.y+(cy-f.y)*t;
    const pn=$("panel"),hide=t>0.3;if(pn.classList.contains("off")!==hide)pn.classList.toggle("off",hide);
  }
  if(autoExit&&!focus){ // keep the station framed while the camera turns
    const [x,y]=P(6300,1700,260),z=Math.min(SW/8600,(SH-140)/4600);camT.x=x;camT.y=y+40/z;camT.z=z;rate=CONFIG.flyRate*0.8;zone="future";
    if(viewP>=1&&walker.t>=1)autoExit=false;
  }
  const zr=cam.z/overviewZoom();
  if(!focus&&!autoExit&&zr<=1.3)zone=walker.s>=DOOR_S?"future":"past";
  if(!focus&&!autoExit&&zr>1.3){let best=null,bd=1e9;for(const it of ITEMS){const d=Math.hypot(it.x-cam.x,it.y-cam.y);if(d<bd){bd=d;best=it;}}zone=best.zone;}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=C.paper;ctx.fillRect(0,0,SW,SH);
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*(SW/2-cam.x*cam.z),DPR*(SH/2-cam.y*cam.z));
  syncVideos();
  drawWorld(t,zr);
  drawOverlay(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- keyboard + mouse ---------- */
addEventListener("keydown",e=>{
  const k=e.key;
  if(k==="ArrowRight"||k==="ArrowDown"){step(1);e.preventDefault();}
  else if(k==="ArrowLeft"||k==="ArrowUp"){step(-1);e.preventDefault();}
  else if(focus&&/^[0-9]$/.test(k)){showPhoto(+k);}
  else if(focus&&(k===","||k===".")){gallerySwipe(k==="."?-1e9:1e9);}
  else if(focus&&k==="Backspace"){showPhoto(0);}
  else if(/^[1-6]$/.test(k)){goTo(zoneItems(zone)[+k-1]);}
  else if(k==="r"||k==="R"){resetPack();}
  else if(k==="z"||k==="Z")switchZone();
  else if(k==="Escape"&&focus)leave();
  else if(k==="o"||k==="O"||k==="Escape"||k==="0")goOverview();
  else if(k==="Enter"){enterOrLeave();e.preventDefault();}
  else if(k==="+"||k==="="){manual();rate=CONFIG.flyRate;zoomBy(1.35);}
  else if(k==="-"||k==="_"){manual();rate=CONFIG.flyRate;zoomBy(1/1.35);}
  else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.().catch(()=>{});}
  else if(k==="c"||k==="C"){if(video.srcObject)$("cam").hidden=!$("cam").hidden;}
  else if(k==="k"||k==="K"){toggleCamera();}
  else if(k==="s"||k==="S"){swapHands=!swapHands;}
});
let drag=null;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,moved:false};cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<5)return;
  if(!drag.moved){drag.moved=true;if(!focus)manual();cv.classList.add("dragging");}
  if(focus)browsePan(-dx/cam.z);else{camT.x-=dx/cam.z;camT.y-=dy/cam.z;}drag.x=e.clientX;drag.y=e.clientY;});
cv.addEventListener("pointerup",e=>{cv.classList.remove("dragging");
  if(drag&&!drag.moved){const [wx,wy]=toWorld(e.clientX,e.clientY);
    clickAt(wx,wy);}
  drag=null;});
cv.addEventListener("wheel",e=>{e.preventDefault();const f=Math.exp(-e.deltaY*0.0015);if(focus){browseZoom(f);return;}manual();
  const [wx,wy]=toWorld(e.clientX,e.clientY);const nz=Math.max(zMin(),Math.min(zMax(),camT.z*f));
  camT.x=wx-(e.clientX-SW/2)/nz;camT.y=wy-(e.clientY-SH/2)/nz;camT.z=nz;},{passive:false});

/* ---------- hand tracking ---------- */
const MP="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const video=$("video"), camCv=$("cam"), camCtx=camCv.getContext("2d");
let landmarker=null, lastVT=-1, swapHands=false;
const HS={L:{seen:false,pinching:false,px:.5,py:.5},R:{seen:false,pinching:false,px:.5,py:.5}};
const hold={key:null,start:0,prog:0,fired:false};
const keyHist=[];let lastPinchEnd=0;
const pinchHold={prog:0,side:null,target:null};

function status(cls,text){$("status").className=cls;$("statusText").textContent=text;$("status").hidden=cls==="ok";}

const inFrame=(()=>{try{return window.top!==window;}catch{return true;}})();
function cameraFailed(msg,err){
  console.error(err);landmarker=null;
  status("bad",msg);
  $("start").hidden=false;$("btnCam").textContent="Try again";
  $("startMsg").textContent=msg;$("startMsg").hidden=false;
}
async function startCamera(){
  $("start").hidden=true;
  if(inFrame){cameraFailed("This is open inside a preview window, which blocks the camera. Download the file and open it directly in Chrome.",new Error("inside iframe"));return;}
  if(!navigator.mediaDevices?.getUserMedia){cameraFailed("This browser can't reach the camera. Open the file in Chrome.",new Error("no getUserMedia"));return;}
  // 1. camera first, so the permission prompt shows straight away
  status("warn","Asking for the camera…");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:"user"},audio:false});
    video.srcObject=stream;await video.play();
  }catch(err){
    const m=err&&err.name==="NotAllowedError"?"Camera blocked. Click the camera icon in Chrome's address bar, choose Allow, then Try again."
      :err&&err.name==="NotFoundError"?"No camera found on this laptop."
      :err&&err.name==="NotReadableError"?"The camera is busy. Turn your video off in Teams (or close other apps using it), then Try again."
      :"Couldn't start the camera ("+(err&&err.name||"unknown")+").";
    cameraFailed(m,err);return;
  }
  camCv.width=320;camCv.height=240;camCv.hidden=false;
  // 2. hand tracking (downloads ~10 MB the first time)
  $("btnCamToggle").hidden=false;$("btnCamToggle").textContent="Camera off";
  if(landmarker){status("ok","Camera on · show your hands");return;}
  status("warn","Camera on · loading hand tracking…");
  try{
    const vision=await import(MP+"/vision_bundle.mjs");
    const files=await vision.FilesetResolver.forVisionTasks(MP+"/wasm");
    const opts=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:"VIDEO",numHands:2,
      minHandDetectionConfidence:.6,minHandPresenceConfidence:.6,minTrackingConfidence:.5});
    try{landmarker=await vision.HandLandmarker.createFromOptions(files,opts("GPU"));}
    catch(e){console.warn("GPU failed, using CPU",e);landmarker=await vision.HandLandmarker.createFromOptions(files,opts("CPU"));}
  }catch(err){
    cameraFailed("Camera works, but the hand-tracking tool couldn't download. Check the internet (some school networks block it; try a phone hotspot), then Try again.",err);return;
  }
  status("ok","Camera on · show your hands");
}
$("btnCam").onclick=startCamera;
$("btnKeys").onclick=()=>{$("start").hidden=true;$("btnCamToggle").hidden=false;$("btnCamToggle").textContent="Camera on";status("ok","");};
// Hand the webcam back to Teams (or take it again). The hand-tracking model stays loaded, so turning it back on is quick.
function cameraOff(){
  const st=video.srcObject;if(st)st.getTracks().forEach(t=>t.stop());
  video.srcObject=null;camCv.hidden=true;
  for(const h of Object.values(HS)){h.seen=false;h.pinching=false;h.prev=null;}
  hold.key=null;hold.prog=0;pinchHold.prog=0;pinchHold.side=null;keyHist.length=0;
  $("btnCamToggle").textContent="Camera on";
  status("warn","Camera off");
}
function toggleCamera(){if(video.srcObject)cameraOff();else startCamera();}
(()=>{const g=$("gGallery")||$("gallery");let d=null;
  g.addEventListener("pointerdown",e=>{if(e.target.closest(".thumb"))return;d={x:e.clientX};g.setPointerCapture(e.pointerId);});
  g.addEventListener("pointermove",e=>{if(!d)return;gallerySwipe(e.clientX-d.x);d.x=e.clientX;});
  g.addEventListener("pointerup",()=>{d=null;gSwipe=0;});
  g.addEventListener("wheel",e=>{e.preventDefault();galleryZoom(Math.exp(-e.deltaY*0.0015));},{passive:false});})();
$("btnCamToggle").onclick=e=>{e.currentTarget.blur();toggleCamera();};
let mouseT=0;addEventListener("mousemove",()=>{document.body.classList.add("mouse");clearTimeout(mouseT);mouseT=setTimeout(()=>document.body.classList.remove("mouse"),2500);});

const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function countFingers(lm){
  let n=0;const w=lm[0];
  for(const [tip,pipj] of [[8,6],[12,10],[16,14],[20,18]]) if(d2(lm[tip],w)>d2(lm[pipj],w)*1.12)n++;
  if(d2(lm[4],lm[9])>d2(lm[2],lm[9])*1.2 && d2(lm[4],lm[5])>d2(lm[0],lm[5])*0.45)n++;
  return n;
}
function isFist(lm){
  const w=lm[0],size=d2(lm[0],lm[9])||0.1;
  for(const [tip,pipj] of [[8,6],[12,10],[16,14],[20,18]]) if(d2(lm[tip],w)>d2(lm[pipj],w)*1.0)return false;
  return d2(lm[8],lm[5])<size*CONFIG.fistTight && d2(lm[12],lm[9])<size*CONFIG.fistTight;
}
function detect(now){
  if(!landmarker||!video.srcObject||video.readyState<2)return;
  if(video.currentTime===lastVT)return;lastVT=video.currentTime;
  let res;try{res=landmarker.detectForVideo(video,now);}catch{return;}
  const hands=(res.landmarks||[]).map(lm=>({lm,mx:1-lm[0].x}));
  drawCamPreview(hands);
  // which hand is which: by position on screen (mirrored)
  let L=null,R=null;
  if(hands.length>=2){hands.sort((a,b)=>a.mx-b.mx);[L,R]=hands;}
  else if(hands.length===1){hands[0].mx<0.5?L=hands[0]:R=hands[0];}
  if(swapHands)[L,R]=[R,L];
  const sides={L,R};
  for(const s of ["L","R"]){
    const h=sides[s],st=HS[s];
    if(!h){if(st.pinching)lastPinchEnd=now;st.seen=false;st.pinching=false;st.prev=null;continue;}
    const lm=h.lm,size=d2(lm[0],lm[9])||0.1,pr=d2(lm[4],lm[8])/size;
    const rx0=1-(lm[4].x+lm[8].x)/2,ry0=(lm[4].y+lm[8].y)/2;
    h.fist=isFist(lm);
    if(h.fist){ // resting hand: ignored completely
      st.fist=true;st.pinching=false;st.prev=null;st.acted=true;
      st.px=st.seen?st.px*0.45+rx0*0.55:rx0;st.py=st.seen?st.py*0.45+ry0*0.55:ry0;st.seen=true;continue;}
    st.fist=false;
    const wasP=st.pinching;
    st.pinching=wasP?pr<CONFIG.pinchOff:pr<CONFIG.pinchOn;
    const rx=1-(lm[4].x+lm[8].x)/2,ry=(lm[4].y+lm[8].y)/2;
    st.px=st.seen?st.px*0.45+rx*0.55:rx;st.py=st.seen?st.py*0.45+ry*0.55:ry;
    st.seen=true;st.count=countFingers(lm);
    const ang=Math.atan2(lm[9].y-lm[0].y,(1-lm[9].x)-(1-lm[0].x));
    if(st.pinching&&!wasP){st.target=null;st.prev={x:st.px,y:st.py};st.start={x:st.px,y:st.py};st.prevAng=ang;st.startAng=ang;st.startT=now;st.acted=false;}
    if(!st.pinching&&wasP){lastPinchEnd=now;st.prev=null;}
    if(focus){   // inside a stop: only browsing (slide + zoom); nothing can leave or jump
      if(st.pinching&&st.prev){
        if(s==="R"){const dx=st.px-st.prev.x;if(!st.acted&&Math.abs(st.px-st.start.x)>0.03)st.acted=true;if(st.acted)browsePan(-dx*SW*CONFIG.panGain/cam.z);}
        else{let dA=ang-st.prevAng;if(dA>Math.PI)dA-=2*Math.PI;if(dA<-Math.PI)dA+=2*Math.PI;
          let net=ang-st.startAng;if(net>Math.PI)net-=2*Math.PI;if(net<-Math.PI)net+=2*Math.PI;
          if(!st.acted&&Math.abs(net)>0.15)st.acted=true;if(st.acted)browseZoom(Math.exp(dA*CONFIG.twistGain));}
      }
      st.prev=st.pinching?{x:st.px,y:st.py}:null;st.prevAng=ang;continue;}
    if(st.pinching&&st.prev){
      if(s==="R"){ // move
        const dx=st.px-st.prev.x,dy=st.py-st.prev.y;
        if(!st.acted&&Math.hypot(st.px-st.start.x,st.py-st.start.y)>0.03){st.acted=true;manual();}
        if(st.acted){camT.x-=dx*SW*CONFIG.panGain/cam.z;camT.y-=dy*SH*CONFIG.panGain/cam.z;}
      }else{ // twist to zoom, like turning a knob
        let dA=ang-st.prevAng;if(dA>Math.PI)dA-=2*Math.PI;if(dA<-Math.PI)dA+=2*Math.PI;
        let net=ang-st.startAng;if(net>Math.PI)net-=2*Math.PI;if(net<-Math.PI)net+=2*Math.PI;
        if(!st.acted&&Math.abs(net)>0.15){st.acted=true;manual();}
        if(st.acted)zoomBy(Math.exp(dA*CONFIG.twistGain));
      }
      st.prev={x:st.px,y:st.py};st.prevAng=ang;
    }
  }
  // pinch and hold still = open the nearest cloud
  pinchHold.prog=0;pinchHold.side=null;pinchHold.target=null;
  if(!focus&&now>quietUntil){
    for(const s of ["R","L"]){const st=HS[s];
      if(st.seen&&st.pinching&&!st.acted){
        if(!st.target||now-st.startT<120)st.target=nearestCloud(st.start.x*SW,st.start.y*SH); // locked to where the pinch began
        const near=st.target;if(!near)continue;
        pinchHold.prog=(now-st.startT)/CONFIG.enterHoldMs;pinchHold.side=s;pinchHold.target=near;
        if(pinchHold.prog>=1){st.acted=true;pinchHold.prog=0;goTo(near);quiet();}
        break;}}
  }
  const n=hands.length;
  status("ok",n?`Camera on · ${n} hand${n>1?"s":""}`:"Camera on · show your hands");
  // held gestures
  let key=null;
  const active=hands.filter(h=>!h.fist);
  if(active.length&&!HS.L.pinching&&!HS.R.pinching&&now-lastPinchEnd>350){
    const cs=active.map(h=>countFingers(h.lm)),tot=cs.reduce((a,b)=>a+b,0),n=active.length;
    if(n===2&&cs[0]===5&&cs[1]===5)key="overview";
    else if(focus)key=(n===1&&cs[0]>=1&&cs[0]<=4&&cs[0]<=(focus.cards.length||0))?"p"+cs[0]:null;   // locked: photos + two-palm leave only
    else if(tot>=1&&tot<=6&&now>quietUntil)key="n"+tot;
  }
  keyHist.push(key);if(keyHist.length>6)keyHist.shift();
  const counts={};keyHist.forEach(k=>counts[k]=(counts[k]||0)+1);
  const stable=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  const sk=stable==="null"?null:stable;
  if(sk!==hold.key){hold.key=sk;hold.start=now;hold.fired=false;hold.prog=0;}
  if(hold.key&&!hold.fired){
    const need=hold.key==="overview"?(focus?CONFIG.leaveHoldMs:700):hold.key==="switch"?900:CONFIG.holdMs;
    hold.prog=(now-hold.start)/need;
    if(hold.prog>=1){hold.fired=true;hold.prog=0;
      if(hold.key==="overview"){if(focus)leave();else goOverview();}
      else if(hold.key==="switch")switchZone();
      else if(hold.key[0]==="p"){showPhoto(+hold.key.slice(1));}
      else{const it=zoneItems(zone)[+hold.key.slice(1)-1];if(it){goTo(it);quiet();}}
    }
  } else if(hold.fired)hold.prog=0;
}
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawCamPreview(hands){
  if(camCv.hidden)return;
  const w=camCv.width,h=camCv.height;
  camCtx.save();camCtx.translate(w,0);camCtx.scale(-1,1);camCtx.drawImage(video,0,0,w,h);camCtx.restore();
  camCtx.lineWidth=2;
  for(const hd of hands){camCtx.strokeStyle="#c8f07a";camCtx.beginPath();
    for(const [a,b] of BONES){camCtx.moveTo((1-hd.lm[a].x)*w,hd.lm[a].y*h);camCtx.lineTo((1-hd.lm[b].x)*w,hd.lm[b].y*h);}camCtx.stroke();
    camCtx.fillStyle="#fff";camCtx.font="bold 18px sans-serif";camCtx.fillText(countFingers(hd.lm),(1-hd.lm[0].x)*w,hd.lm[0].y*h+20);}
}
</script>
